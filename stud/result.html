<!DOCTYPE html>
<html>
<head>
    <title>Student Result System</title>
</head>
<body>

    <h1>Student Result System</h1>

    <form id="resultForm">

        <label>Student Name:</label>
        <input type="text" id="name" required>
        <br><br>

        <label>Roll Number:</label>
        <input type="number" id="roll" required>
        <br><br>

        <h3>Enter Marks (Out of 100)</h3>

        <label>English:</label>
        <input type="number" id="english" min="0" max="100" required>
        <br><br>

        <label>Maths:</label>
        <input type="number" id="maths" min="0" max="100" required>
        <br><br>

        <label>Science:</label>
        <input type="number" id="science" min="0" max="100" required>
        <br><br>

        <label>Computer:</label>
        <input type="number" id="computer" min="0" max="100" required>
        <br><br>

        <label>History:</label>
        <input type="number" id="history" min="0" max="100" required>
        <br><br>

        <button type="submit">Calculate Result</button>

    </form>

    <hr>

    <h2>Student Result</h2>

    <div id="result"></div>

    <script>
        document.getElementById("resultForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let roll = document.getElementById("roll").value;

            let english = Number(document.getElementById("english").value);
            let maths = Number(document.getElementById("maths").value);
            let science = Number(document.getElementById("science").value);
            let computer = Number(document.getElementById("computer").value);
            let history = Number(document.getElementById("history").value);

            let total = english + maths + science + computer + history;

            let percentage = total / 5;

            let status;

            if (
                english >= 35 &&
                maths >= 35 &&
                science >= 35 &&
                computer >= 35 &&
                history >= 35
            ) {
                status = "PASS";
            } else {
                status = "FAIL";
            }

            document.getElementById("result").innerHTML = `
                <h3>Result Details</h3>

                <p><b>Student Name:</b> ${name}</p>
                <p><b>Roll Number:</b> ${roll}</p>

                <table border="1" cellpadding="10">
                    <tr>
                        <th>Subject</th>
                        <th>Marks</th>
                    </tr>

                    <tr><td>English</td><td>${english}</td></tr>
                    <tr><td>Maths</td><td>${maths}</td></tr>
                    <tr><td>Science</td><td>${science}</td></tr>
                    <tr><td>Computer</td><td>${computer}</td></tr>
                    <tr><td>History</td><td>${history}</td></tr>

                    <tr>
                        <th>Total</th>
                        <th>${total} / 500</th>
                    </tr>

                    <tr>
                        <th>Percentage</th>
                        <th>${percentage}%</th>
                    </tr>

                    <tr>
                        <th>Result</th>
                        <th>${status}</th>
                    </tr>
                </table>
            `;

        });
    </script>

</body>
</html>
