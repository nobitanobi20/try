<!DOCTYPE html>
<html>
<head>
    <title>Employee Management System</title>
</head>
<body>

    <h1>Employee Management System</h1>

    <h2>Add Employee</h2>

    Employee ID:
    <input type="number" id="id"><br><br>

    Employee Name:
    <input type="text" id="name"><br><br>

    Department:
    <input type="text" id="department"><br><br>

    Salary:
    <input type="number" id="salary"><br><br>

    <button onclick="addEmployee()">Add Employee</button>

    <hr>

    <h2>Search Employee</h2>

    Enter Employee ID:
    <input type="number" id="searchId">

    <button onclick="searchEmployee()">Search</button>

    <p id="searchResult"></p>

    <hr>

    <h2>Employee List</h2>

    <button onclick="displayEmployees()">View Employees</button>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="employeeTable"></tbody>
    </table>

    <script>
        let employees = [];

        function addEmployee() {
            let id = document.getElementById("id").value;
            let name = document.getElementById("name").value;
            let department = document.getElementById("department").value;
            let salary = document.getElementById("salary").value;

            if (id === "" || name === "" ||
                department === "" || salary === "") {
                alert("Please fill all fields");
                return;
            }

            if (employees.some(emp => emp.id === Number(id))) {
                alert("Employee ID already exists");
                return;
            }

            let employee = {
                id: Number(id),
                name: name,
                department: department,
                salary: Number(salary)
            };

            employees.push(employee);

            alert("Employee added successfully");

            document.getElementById("id").value = "";
            document.getElementById("name").value = "";
            document.getElementById("department").value = "";
            document.getElementById("salary").value = "";

            displayEmployees();
        }

        function displayEmployees() {
            let table = document.getElementById("employeeTable");

            table.innerHTML = "";

            employees.forEach(function(emp) {
                let row = table.insertRow();

                row.insertCell(0).textContent = emp.id;
                row.insertCell(1).textContent = emp.name;
                row.insertCell(2).textContent = emp.department;
                row.insertCell(3).textContent = emp.salary;

                let actionCell = row.insertCell(4);

                let editButton = document.createElement("button");
                editButton.textContent = "Edit";
                editButton.onclick = function() {
                    editEmployee(emp.id);
                };

                let deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";
                deleteButton.onclick = function() {
                    deleteEmployee(emp.id);
                };

                actionCell.appendChild(editButton);
                actionCell.appendChild(deleteButton);
            });
        }

        function searchEmployee() {
            let id = Number(document.getElementById("searchId").value);

            let employee = employees.find(function(emp) {
                return emp.id === id;
            });

            let result = document.getElementById("searchResult");

            if (employee) {
                result.textContent =
                    "ID: " + employee.id +
                    ", Name: " + employee.name +
                    ", Department: " + employee.department +
                    ", Salary: " + employee.salary;
            } else {
                result.textContent = "Employee not found";
            }
        }

        function editEmployee(id) {
            let employee = employees.find(function(emp) {
                return emp.id === id;
            });

            if (employee) {
                let name = prompt("Enter new name:", employee.name);

                if (name === null) return;

                let department = prompt(
                    "Enter new department:", employee.department
                );

                if (department === null) return;

                let salary = prompt(
                    "Enter new salary:", employee.salary
                );

                if (salary === null) return;

                if (name.trim() === "" ||
                    department.trim() === "" ||
                    salary.trim() === "" ||
                    !Number.isFinite(Number(salary)) ||
                    Number(salary) < 0) {
                    alert("Please enter valid details");
                    return;
                }

                employee.name = name.trim();
                employee.department = department.trim();
                employee.salary = Number(salary);

                alert("Employee updated successfully");

                displayEmployees();
            }
        }

        function deleteEmployee(id) {
            let confirmDelete = confirm(
                "Are you sure you want to delete this employee?"
            );

            if (confirmDelete) {
                employees = employees.filter(function(emp) {
                    return emp.id !== id;
                });

                alert("Employee deleted successfully");

                displayEmployees();
            }
        }
    </script>

</body>
</html>
